name: CI

on: [push, pull_request]

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: astral-sh/setup-uv@v10.3.3
        - run: uv python install
        - run: uv sync --locked
        - run: uv run ruff check
        - run: uv run pytest
