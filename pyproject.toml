[project]
name = "energy-data-ingestion-pipeline"
version = "0.1.0"
description = "Pipeline to get Excel file data/tables into database."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[project.scripts]
energy-data-ingestion-pipeline = "energy_data_ingestion_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
extend-select = ["E"]

[tool.pytest.ini_options]
testpaths = ["tests"]
